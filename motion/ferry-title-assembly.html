<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferry Title Assembly</title>
  <style>
    :root {
      --bg: #f3efe7;
      --grid-a: #e7dfd3;
      --grid-b: #f8f5ef;
      --ink: #17181d;
      --muted: #6f6258;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(45deg, var(--grid-a) 25%, transparent 25%) 0 0 / 24px 24px,
        linear-gradient(-45deg, var(--grid-a) 25%, transparent 25%) 0 12px / 24px 24px,
        linear-gradient(45deg, transparent 75%, var(--grid-a) 75%) 12px -12px / 24px 24px,
        linear-gradient(-45deg, transparent 75%, var(--grid-a) 75%) -12px 0 / 24px 24px,
        var(--bg);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--ink);
    }

    .wrap {
      position: relative;
      width: 1100px;
      height: 680px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .hud {
      position: absolute;
      left: 0;
      top: -42px;
      display: flex;
      width: 100%;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .controls {
      position: absolute;
      bottom: -78px;
      display: flex;
      gap: 14px;
    }

    button {
      padding: 12px 20px;
      border: 1px solid var(--ink);
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      position: absolute;
      bottom: -122px;
      font-size: 13px;
      color: var(--muted);
      display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <div>FERRY / TITLE ASSEMBLY</div>
      <div>VISCOUS + DYNAMIC</div>
    </div>
    <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
      <g id="assembly">
      <path id="skeleton" d="M70 160H1530A30 30 0 0 1 1560 190V610A30 30 0 0 1 1530 640H70A30 30 0 0 1 40 610V190A30 30 0 0 1 70 160Z" stroke="#17181d" stroke-width="8"/>
      <path class="part accent" d="M120 648H1285V674H120Z" fill="#C75D32"/>

      <path class="part dark" d="M120 230H174V528H120Z" fill="#15161A"/>
      <path class="part accent" d="M120 230H314V282H120Z" fill="#C75D32"/>
      <path class="part dark" d="M120 351H276V403H120Z" fill="#15161A"/>

      <path class="part dark" d="M370 230H424V528H370Z" fill="#15161A"/>
      <path class="part accent" d="M370 230H566V282H370Z" fill="#C75D32"/>
      <path class="part dark" d="M370 351H544V403H370Z" fill="#15161A"/>
      <path class="part accent" d="M370 476H566V528H370Z" fill="#C75D32"/>

      <path class="part dark" d="M620 230H674V528H620Z" fill="#15161A"/>
      <path class="part accent" d="M620 230H818V282H620Z" fill="#C75D32"/>
      <path class="part dark" d="M620 351H804V403H620Z" fill="#15161A"/>
      <path class="part accent" d="M764 282H818V403H764Z" fill="#C75D32"/>
      <path class="part dark" d="M674 403H756L842 528H768L674 434Z" fill="#15161A"/>

      <path class="part dark" d="M902 230H956V528H902Z" fill="#15161A"/>
      <path class="part accent" d="M902 230H1100V282H902Z" fill="#C75D32"/>
      <path class="part dark" d="M902 351H1086V403H902Z" fill="#15161A"/>
      <path class="part accent" d="M1046 282H1100V403H1046Z" fill="#C75D32"/>
      <path class="part dark" d="M956 403H1038L1124 528H1050L956 434Z" fill="#15161A"/>

      <path class="part accent" d="M1180 230H1244L1324 346H1256L1180 230Z" fill="#C75D32"/>
      <path class="part dark" d="M1394 230H1458L1378 346H1310L1394 230Z" fill="#15161A"/>
      <path class="part accent" d="M1330 346H1384V528H1330Z" fill="#C75D32"/>

      <text class="label" x="120" y="735" font-family="Arial Black, Impact, sans-serif" font-size="48" letter-spacing="3" fill="#191A1F">
        NOT A TOOL, A HUMAN–AI PROTOCOL
      </text>
      <text class="sublabel" x="120" y="788" font-family="Inter, Arial, sans-serif" font-size="26" letter-spacing="5" fill="#6F6258">
        INTENT / EXECUTION / MEMORY / EVOLUTION
      </text>
      </g>
    </svg>
    <div class="controls">
      <button onclick="playAnimation()">Replay</button>
      <button id="export-btn" onclick="exportSequence()">Export Transparent Sequence</button>
    </div>
    <div id="status">Rendering...</div>
  </div>

  <script>
    const totalDuration = 2600;
    let rafId = null;
    let exportPrepared = false;
    const scene = document.querySelector("#scene");
    const assembly = document.querySelector("#assembly");
    const skeleton = document.querySelector("#skeleton");
    const parts = Array.from(document.querySelectorAll(".part"));
    const labels = Array.from(document.querySelectorAll(".label, .sublabel"));
    const partStates = [];

    function pseudo(seed) {
      const x = Math.sin(seed * 999.91) * 10000;
      return x - Math.floor(x);
    }

    function randomOffscreen(seed, distanceMin, distanceMax) {
      const angle = pseudo(seed) * Math.PI * 2;
      const distance = distanceMin + pseudo(seed + 0.37) * (distanceMax - distanceMin);
      return {
        x: Math.cos(angle) * distance,
        y: Math.sin(angle) * distance,
      };
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeOutBack(t, s = 4.2) {
      const c1 = s;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function easeOutElastic(t) {
      const c4 = (2 * Math.PI) / 3;
      if (t === 0) return 0;
      if (t === 1) return 1;
      return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function setupState() {
      if (partStates.length) return;
      parts.forEach((part, index) => {
        const offset = randomOffscreen(index + 1, 2400, 5200);
        const rotation = pseudo(index + 8) > 0.5 ? 270 : -270;
        const delay = 420 + index * 35;
        partStates.push({ part, offset, rotation, delay });
      });
    }

    function renderAt(ms) {
      setupState();

      const sceneT = easeOutCubic(clamp01(ms / totalDuration));
      const sceneRotation = lerp(-180, 0, sceneT);
      const sceneScale = lerp(0.16, 1, sceneT);
      assembly.setAttribute("transform", `translate(800 450) rotate(${sceneRotation}) scale(${sceneScale}) translate(-800 -450)`);

      const skeletonT = easeOutElastic(clamp01((ms - 120) / 1200));
      skeleton.style.opacity = String(skeletonT);
      skeleton.setAttribute("transform", `translate(800 450) scale(${lerp(0.8, 1, skeletonT)}) translate(-800 -450)`);

      partStates.forEach(({ part, offset, rotation, delay }) => {
        const t = easeOutBack(clamp01((ms - delay) / 1050));
        const x = lerp(offset.x, 0, t);
        const y = lerp(offset.y, 0, t);
        const r = lerp(rotation, 0, t);
        const sx = lerp(0.06, 1, t);
        const sy = lerp(4.2, 1, t);
        part.style.opacity = String(t);
        part.setAttribute("transform", `translate(${x} ${y}) rotate(${r} 800 450) scale(${sx} ${sy})`);
      });

      labels.forEach((label, index) => {
        const t = easeOutCubic(clamp01((ms - (1200 + index * 80)) / 700));
        const y = lerp(24, 0, t);
        const blur = lerp(8, 0, t);
        label.style.opacity = String(t);
        label.setAttribute("transform", `translate(0 ${y})`);
        label.style.filter = `blur(${blur}px)`;
      });
    }

    async function exportSequence() {
      if (!window.JSZip) {
        alert("JSZip failed to load. Export is unavailable.");
        return;
      }

      const btn = document.getElementById("export-btn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.style.display = "block";

      const fps = 30;
      const totalFrames = Math.ceil((totalDuration / 1000) * fps);
      const zip = new JSZip();
      const folder = zip.folder("ferry_title_frames");
      const canvas = document.createElement("canvas");
      canvas.width = 1920;
      canvas.height = 1080;
      const ctx = canvas.getContext("2d");
      const svg = document.querySelector("svg");

      for (let i = 0; i <= totalFrames; i++) {
        status.textContent = `Rendering ${i}/${totalFrames}`;
        renderAt((i / totalFrames) * totalDuration);
        svg.setAttribute("width", canvas.width);
        svg.setAttribute("height", canvas.height);
        const svgData = new XMLSerializer().serializeToString(svg);
        const url = URL.createObjectURL(new Blob([svgData], { type: "image/svg+xml;charset=utf-8" }));
        await new Promise((resolve) => {
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            folder.file(`frame_${String(i).padStart(4, "0")}.png`, canvas.toDataURL("image/png").split(",")[1], { base64: true });
            URL.revokeObjectURL(url);
            resolve();
          };
          img.src = url;
        });
      }

      const content = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(content);
      a.download = "ferry-title-assembly-frames.zip";
      a.click();

      status.textContent = "Done";
      btn.disabled = false;
    }

    function playAnimation() {
      setupState();
      if (rafId) cancelAnimationFrame(rafId);
      const start = performance.now();
      function tick(now) {
        const elapsed = now - start;
        renderAt(Math.min(elapsed, totalDuration));
        if (elapsed < totalDuration) {
          rafId = requestAnimationFrame(tick);
        }
      }
      rafId = requestAnimationFrame(tick);
    }

    document.addEventListener("DOMContentLoaded", playAnimation);
  </script>
</body>
</html>
